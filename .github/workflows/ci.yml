# CI on every push and pull request: `pnpm verify` without its chaos and memory steps on macOS (arm64) and on Linux
# (x64 and arm64), each system running its own set of steps. The pre-push hook (the whole `pnpm verify`) stays, and the
# Playwright e2e suite runs locally (`pnpm test:e2e`). Actions are pinned by commit; the job's token can only read the
# repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The chaos and memory suites run before every push (the pre-push hook) and are left out here: shared runners
      # are too slow and too uneven for their timing and leak budgets, which are set for a person's machine
      - run: pnpm verify --skip chaos,memory

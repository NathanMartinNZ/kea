# What every CI job needs before it runs a test: pnpm and Node at the versions the repository pins, the Rust cache,
# Electron's binary (cached), the dependencies, on Linux the test machine's needs (CONTRIBUTING.md), and kea-helper.
name: Set up Kea's toolchain
description: pnpm, Node, the caches, the dependencies and the built helper
runs:
  using: composite
  steps:
    # pnpm first: setup-node's pnpm cache asks pnpm where its store is. The version comes from package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: native/kea-helper
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    # Test runs on Linux draw on an Xvfb of their own and need zsh as the login shell they check
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb zsh
    # Builds the patched file watcher from source and fetches Electron's binary
    - shell: bash
      run: pnpm install --frozen-lockfile
    # Ubuntu's AppArmor refuses Electron user namespaces, so Chromium's sandbox needs its set-uid helper. Kea never
    # runs with --no-sandbox.
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        electron="$(node -p "require('node:module').createRequire(process.cwd() + '/app/main/package.json')('electron')")"
        helper="$(dirname "$electron")/chrome-sandbox"
        sudo chown root:root "$helper"
        sudo chmod 4755 "$helper"
    # Some unit tests use the built helper
    - shell: bash
      run: pnpm helper:build

# Every cap, timeout and interval in Kea. Each entry has a value, a unit and why. A number that differs by system adds
# `linux = …` and/or `darwin = …`, with `why_linux` saying why.
# `pnpm codegen` writes packages/protocol/src/generated/limits.ts and native/kea-helper/src/limits.rs from this file;
# code reads its numbers from there and never writes one inline.

# ── architecture ────────────────────────────────────────────────────────────────

[supervisor_backoff_min_ms]
value = 200
unit = "ms"
why = "first restart delay after a supervised process exits"

[supervisor_backoff_max_ms]
value = 5000
unit = "ms"
why = "restart delay doubles up to this"

[supervisor_heartbeat_ms]
value = 2000
unit = "ms"
why = "heartbeat interval for core and ptyhost"

[supervisor_missed_heartbeats]
value = 3
unit = "count"
why = "kill + restart after this many missed heartbeats"

[supervisor_healthy_reset_ms]
value = 30000
unit = "ms"
why = "backoff resets after a process stays up this long"

[supervisor_shutdown_grace_ms]
value = 2000
unit = "ms"
why = "full quit: how long main waits for core and ptyhost to exit after `shutdown` before stopping them"

[store_tick_ms]
value = 16
unit = "ms"
why = "store deltas coalesced to at most one message per store per tick; also the DB write-batch tick"

[frame_fallback_ms]
value = 50
unit = "ms"
why = "a window that gets no animation frames (hidden or covered) still flushes its store copies after this long; longer than a frame at 30 Hz or faster, so a shown window's stores flush once per frame"

[core_control_waiters_max]
value = 256
unit = "count"
why = "core's calls waiting for ptyhost's control port while ptyhost is away; one more fails at once with `unavailable`"

[reconnecting_bar_delay_ms]
value = 500
unit = "ms"
why = "core away longer than this before the window shows the thin Reconnecting… bar"


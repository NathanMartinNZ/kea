[package]
name = "kea-helper"
version = "1.0.2"
edition = "2024"
publish = false
description = "Kea's native helper: PTY holder, hook relay, footprint and port probes"
license = "MIT"
repository = "https://github.com/NathanMartinNZ/kea"

[lib]
name = "kea_helper"
path = "src/lib.rs"

[[bin]]
name = "kea-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Used by `hook` only, for the payload projection. The holder's protocol path has no JSON parser.
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No panic is reachable from input; unwinding keeps a bug visible (backtrace) instead of hiding it.
panic = "unwind"
